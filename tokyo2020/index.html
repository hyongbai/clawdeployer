<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2020 东京奥运会奖牌榜 Top 6</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0e1a;--card:#131a2e;--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;
    --text:#e8eaf6;--accent:#4fc3f7;--border:rgba(255,255,255,.06);
  }
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;padding:2rem 1rem;
    background-image:radial-gradient(ellipse at 20% 0%,rgba(79,195,247,.08) 0%,transparent 60%),
                      radial-gradient(ellipse at 80% 100%,rgba(255,215,0,.06) 0%,transparent 60%);
  }

  .container{max-width:900px;margin:0 auto}

  /* Header */
  header{text-align:center;margin-bottom:3rem}
  .rings{font-size:2.4rem;letter-spacing:.3rem;margin-bottom:.6rem}
  h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;letter-spacing:.05em}
  h1 span{background:linear-gradient(135deg,var(--gold),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{color:#7986cb;margin-top:.4rem;font-size:.95rem}

  /* Table */
  .table-wrap{
    background:var(--card);border-radius:16px;overflow:hidden;
    border:1px solid var(--border);
    box-shadow:0 8px 32px rgba(0,0,0,.35);
  }
  table{width:100%;border-collapse:collapse}
  thead th{
    padding:1rem .8rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;
    color:#7986cb;border-bottom:1px solid var(--border);text-align:center;
    background:rgba(0,0,0,.2);
  }
  thead th:nth-child(2){text-align:left}
  tbody tr{
    transition:background .25s;
    opacity:0;transform:translateY(18px);
    animation:rowIn .5s ease forwards;
  }
  tbody tr:hover{background:rgba(79,195,247,.06)}
  tbody td{
    padding:1rem .8rem;text-align:center;
    border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums;
  }
  tbody tr:last-child td{border-bottom:none}

  /* Rank badge */
  .rank{
    display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:50%;font-weight:700;font-size:.9rem;
  }
  .rank-1{background:linear-gradient(135deg,#ffd700,#ffb300);color:#3e2723}
  .rank-2{background:linear-gradient(135deg,#e0e0e0,#9e9e9e);color:#212121}
  .rank-3{background:linear-gradient(135deg,#cd7f32,#a1623a);color:#fff}
  .rank-4,.rank-5,.rank-6{background:rgba(79,195,247,.15);color:var(--accent)}

  /* Country cell */
  .country{display:flex;align-items:center;gap:.7rem;text-align:left}
  .flag{font-size:1.6rem;line-height:1}
  .country-name{font-weight:600;font-size:1rem}

  /* Medal pills */
  .medal{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:36px;padding:.25rem .55rem;border-radius:20px;font-weight:600;font-size:.9rem;
  }
  .m-gold{background:rgba(255,215,0,.12);color:var(--gold)}
  .m-silver{background:rgba(192,192,192,.1);color:var(--silver)}
  .m-bronze{background:rgba(205,127,50,.12);color:var(--bronze)}
  .total{font-weight:700;font-size:1.05rem;color:var(--accent)}

  /* Bar chart in total */
  .bar-cell{position:relative}
  .bar-bg{
    position:absolute;left:0;top:50%;height:60%;border-radius:0 6px 6px 0;
    background:linear-gradient(90deg,rgba(79,195,247,.1),rgba(79,195,247,.04));
    transform:translateY(-50%);transition:width .8s cubic-bezier(.4,0,.2,1);
    z-index:0;
  }
  .bar-cell .total{position:relative;z-index:1}

  /* Row animation */
  @keyframes rowIn{to{opacity:1;transform:translateY(0)}}
  tbody tr:nth-child(1){animation-delay:.1s}
  tbody tr:nth-child(2){animation-delay:.2s}
  tbody tr:nth-child(3){animation-delay:.3s}
  tbody tr:nth-child(4){animation-delay:.4s}
  tbody tr:nth-child(5){animation-delay:.5s}
  tbody tr:nth-child(6){animation-delay:.6s}

  /* Gold shimmer for #1 */
  tbody tr:first-child{
    background:linear-gradient(90deg,rgba(255,215,0,.04),transparent 60%);
  }
  tbody tr:first-child:hover{
    background:linear-gradient(90deg,rgba(255,215,0,.08),rgba(79,195,247,.04) 60%);
  }

  /* Responsive */
  @media(max-width:560px){
    thead th,tbody td{padding:.7rem .45rem;font-size:.82rem}
    .flag{font-size:1.2rem}
    .country-name{font-size:.88rem}
    .medal{min-width:28px;padding:.2rem .4rem;font-size:.8rem}
    .rank{width:26px;height:26px;font-size:.78rem}
  }

  footer{text-align:center;margin-top:2rem;color:#546e7a;font-size:.8rem}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="rings">&#x1F539;&#x1F7E1;&#x26AB;&#x1F7E2;&#x1F534;</div>
    <h1><span>TOKYO 2020</span> 奖牌榜</h1>
    <div class="subtitle">Top 6 Nations &middot; 2021 Tokyo Olympic Games</div>
  </header>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>国家 / 地区</th>
          <th>&#x1F947; 金牌</th><th>&#x1F948; 银牌</th><th>&#x1F949; 铜牌</th><th>总计</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer>数据来源：国际奥委会 (IOC) &middot; 按金牌数排序</footer>
</div>

<script>
const data = [
  { rank:1, flag:"\u{1F1FA}\u{1F1F8}", name:"美国",          gold:39, silver:41, bronze:33 },
  { rank:2, flag:"\u{1F1E8}\u{1F1F3}", name:"中国",          gold:38, silver:32, bronze:18 },
  { rank:3, flag:"\u{1F1EF}\u{1F1F5}", name:"日本",          gold:27, silver:14, bronze:17 },
  { rank:4, flag:"\u{1F1EC}\u{1F1E7}", name:"英国",          gold:22, silver:21, bronze:22 },
  { rank:5, flag:"\u{1F1F7}\u{1F1FA}", name:"俄罗斯奥委会",  gold:20, silver:28, bronze:23 },
  { rank:6, flag:"\u{1F1E6}\u{1F1FA}", name:"澳大利亚",      gold:17, silver:7,  bronze:22 },
];

const maxTotal = Math.max(...data.map(d => d.gold + d.silver + d.bronze));
const tbody = document.getElementById("tbody");

data.forEach(d => {
  const total = d.gold + d.silver + d.bronze;
  const pct = (total / maxTotal * 100).toFixed(1);
  tbody.insertAdjacentHTML("beforeend", `
    <tr>
      <td><span class="rank rank-${d.rank}">${d.rank}</span></td>
      <td><div class="country"><span class="flag">${d.flag}</span><span class="country-name">${d.name}</span></div></td>
      <td><span class="medal m-gold">${d.gold}</span></td>
      <td><span class="medal m-silver">${d.silver}</span></td>
      <td><span class="medal m-bronze">${d.bronze}</span></td>
      <td class="bar-cell"><div class="bar-bg" style="width:${pct}%"></div><span class="total">${total}</span></td>
    </tr>
  `);
});
</script>
</body>
</html>
